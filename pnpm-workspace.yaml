packages:
  - apps/*
  - packages/*
  - tooling/*
  - workers/*

allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  msw: false
  protobufjs: false
  sharp: true
  unrs-resolver: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - esbuild@0.25.0 || 0.28.1
  - file-type@21.3.1 || 21.3.2
  - flatted@3.4.0 || 3.4.2
  - fast-xml-parser@5.5.6 || 5.5.7 || 5.7.0
  - brace-expansion@1.1.13 || 5.0.5 || 5.0.6
  - picomatch@4.0.4
  - dompurify@3.3.2 || 3.3.4 || 3.4.0 || 3.4.6 || 3.4.7 || 3.4.8 || 3.4.9 || 3.4.11
  - lodash@4.17.24
  - defu@6.1.5
  - postcss@8.5.10
  - protobufjs@7.5.5 || 7.5.6 || 7.5.8 || 7.6.1 || 7.6.3 || 8.7.1
  - fast-uri@3.1.1 || 3.1.2
  - hono@4.12.14 || 4.12.16 || 4.12.18 || 4.12.21 || 4.12.25
  - ip-address@10.1.1
  - "@protobufjs/utf8@1.1.1"
  - fast-xml-builder@1.1.7
  - ws@8.20.1 || 8.21.0
  - uuid@11.1.1
  - qs@6.15.2
  - "@opentelemetry/sdk-node@0.217.0"
  - "@opentelemetry/exporter-prometheus@0.217.0"
  - shell-quote@1.8.4
  - "@grpc/grpc-js@1.14.4"
  - vite@7.3.5
  - launch-editor@2.14.1
  - "@opentelemetry/core@2.8.0"
  - undici@7.28.0
  - js-yaml@4.1.2
  - "@babel/core@7.29.1"

overrides:
  "@babel/core@<=7.29.0": ^7.29.1
  "@opentelemetry/core@<2.8.0": ^2.8.0
  "@opentelemetry/exporter-prometheus@<0.217.0": ^0.217.0
  "@opentelemetry/sdk-node@<0.217.0": ^0.217.0
  "@types/minimatch": 5.1.2
  esbuild@<=0.24.2: 0.25.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-xml-parser@<5.7.0: ^5.7.0
  fast-xml-parser@>=5.0.0 <5.5.6: ^5.5.6
  fast-xml-parser@>=5.0.0 <5.5.7: ^5.5.7
  file-type@>=13.0.0 <21.3.1: ^21.3.1
  file-type@>=20.0.0 <=21.3.1: ^21.3.2
  ioredis: 5.10.0
  ip-address@<=10.1.0: ^10.1.1
  js-yaml@>=4.0.0 <=4.1.1: ^4.1.2
  postcss@<8.5.10: ^8.5.10
  protobufjs@<8.7.1: 8.7.1
  undici@>=7.0.0 <7.28.0: ^7.28.0
  undici@>=7.23.0 <7.28.0: ^7.28.0
  uuid@<11.1.1: ^11.1.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
