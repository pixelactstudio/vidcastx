# ─── Releases ─────────────────────────────────────────
# release-please reads Conventional Commits on main and keeps a release PR
# open with the next version and CHANGELOG. Merging that PR tags the
# release and publishes GitHub release notes.
#
# PRs opened with GITHUB_TOKEN don't trigger other workflows, so the
# release PR won't run CI on its own; it only touches CHANGELOG.md and
# version fields, which CI already validated on main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
