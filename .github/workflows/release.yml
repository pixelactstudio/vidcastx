# ─── Releases ─────────────────────────────────────────
# release-please reads Conventional Commits on main and keeps a release PR
# open with the next version and CHANGELOG. Merging that PR tags the
# release and publishes GitHub release notes.
#
# The release PR is opened with GITHUB_TOKEN, and the repo's approval
# policy treats github-actions[bot] as a first-time contributor, so its
# CI runs wait in "action_required". To release: open the PR, click
# "Approve workflows to run", wait for CI, approve the PR and merge.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
