# ─── Pull request hygiene ─────────────────────────────
# - PR titles follow Conventional Commits (they become merge-commit
#   subjects and feed release-please's changelog).
# - New or updated dependencies with known high-severity advisories fail.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            chore
            build
            ci
            style
            revert

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
